name: Build and Release Jellyfile

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Debug folder structure
      run: ls -R


    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Install client dependencies
      run: |
        cd jellyfile.client
        npm ci

    - name: Build client
      run: |
        cd jellyfile.client
        npm run build

    - name: Publish .NET server
      run: |
        cd Jellyfile.Server
        dotnet publish -c Release -o publish/

    - name: Prepare release package
      run: |
        mkdir -p release
        cp -r jellyfile.client/dist release/client
        cp -r Jellyfile.Server/publish release/server
        ZIP_NAME="Jellyfile_${GITHUB_REF##*/}.zip"
        cd release
        zip -r "../$ZIP_NAME" .
        cd ..
        ls -l ../release

    - name: Create GitHub Release
      run: |
        gh release create ${{ github.ref_name }} ./Jellyfile_${{ github.ref_name }}.zip \
          --title "Release ${{ github.ref_name }}" \
          --notes "Automated release from GitHub Actions"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
