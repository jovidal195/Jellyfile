name: Build and Release Jellyfile

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Debug folder structure
      run: ls -R


    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Install client dependencies
      run: |
        cd jellyfile.client
        npm ci

    - name: Build client
      run: |
        cd jellyfile.client
        npm run build

    - name: Publish .NET server
      run: |
        cd Jellyfile.Server
        dotnet publish -c Release -o publish/

    - name: Prepare release package
      run: |
        mkdir release
        cp -r jellyfile.client/dist release/client
        cp -r Jellyfile.Server/publish release/server
        cd release
        zip -r ../Jellyfile_${GITHUB_REF##*/}.zip .

    - name: Create GitHub Release
      run: |
        gh release create v${{ github.ref_name }} ./Jellyfile_v${{ github.ref_name }}.zip \
          --title "Release v${{ github.ref_name }}" \
          --notes "Automated release from GitHub Actions"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
